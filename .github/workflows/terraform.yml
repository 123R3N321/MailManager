name: terraform

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      # Plan is intentionally local/operator-run (`make tf-plan`) because it requires
      # working AWS credentials and creates a read-heavy refresh against your account.
